<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>約分與通分</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-unit="fractions">
  <div class="bg" aria-hidden="true"></div>
  <main class="app">
    <header class="hero">
      <nav class="unit-nav" data-unit-menu aria-label="數學單元"></nav>
      <p class="brand">約分與通分</p>
      <h1>分子、分母同乘或同除，分數值不變</h1>
      <p class="lede">用短除法看清楚：約分是一起除，通分是一起乘。</p>
    </header>

    <section class="panel" aria-label="操作區">
      <div class="modes" role="tablist" aria-label="模式">
        <button type="button" class="mode is-active" data-mode="reduce" role="tab" aria-selected="true">約分</button>
        <button type="button" class="mode" data-mode="common" role="tab" aria-selected="false">通分</button>
        <button type="button" class="mode" data-mode="picture" role="tab" aria-selected="false">畫圖</button>
      </div>

      <form id="form" class="form" autocomplete="off">
        <div class="inputs" id="inputs-reduce">
          <div class="work-row">
            <label>
              <span>分數</span>
              <span class="frac-input">
                <input id="num" type="number" min="1" max="999" value="24" required />
                <span class="bar" aria-hidden="true"></span>
                <input id="den" type="number" min="1" max="999" value="42" required />
              </span>
            </label>
            <div id="reduce-work" class="reduce-work" hidden aria-live="polite"></div>
          </div>
        </div>

        <div class="inputs is-hidden" id="inputs-common">
          <div class="work-row">
            <label>
              <span>分數 A</span>
              <span class="frac-input">
                <input id="a-num" type="number" min="1" max="999" value="1" />
                <span class="bar" aria-hidden="true"></span>
                <input id="a-den" type="number" min="1" max="999" value="6" />
              </span>
            </label>
            <label>
              <span>分數 B</span>
              <span class="frac-input">
                <input id="b-num" type="number" min="1" max="999" value="1" />
                <span class="bar" aria-hidden="true"></span>
                <input id="b-den" type="number" min="1" max="999" value="4" />
              </span>
            </label>
            <div id="common-work" class="common-work" hidden aria-live="polite"></div>
          </div>
        </div>

        <div class="inputs is-hidden" id="inputs-picture">
          <div class="cut">
            <span class="cut-label" id="cut-label">每一格再分成</span>
            <div class="level-picks" role="radiogroup" aria-labelledby="cut-label">
              <button type="button" class="level-btn" data-cut="2" role="radio" aria-checked="false">2</button>
              <button type="button" class="level-btn is-active" data-cut="3" role="radio" aria-checked="true">3</button>
              <button type="button" class="level-btn" data-cut="4" role="radio" aria-checked="false">4</button>
            </div>
            <span class="cut-unit">小格</span>
          </div>
        </div>

        <div id="calc-controls">
        <div class="speed">
          <span class="speed-label" id="speed-label">動畫時間</span>
          <div class="speed-picks" role="radiogroup" aria-labelledby="speed-label">
            <button type="button" class="speed-btn is-active" data-seconds="3" role="radio" aria-checked="true">3</button>
            <button type="button" class="speed-btn" data-seconds="12" role="radio" aria-checked="false">12</button>
            <button type="button" class="speed-btn" data-seconds="24" role="radio" aria-checked="false">24</button>
            <button type="button" class="speed-btn" data-seconds="47" role="radio" aria-checked="false">47</button>
            <button type="button" class="speed-btn" data-seconds="60" role="radio" aria-checked="false">60</button>
          </div>
          <span class="speed-unit">秒</span>
        </div>

        <div class="level">
          <span class="level-label" id="level-label">練習等級</span>
          <div class="level-picks" role="radiogroup" aria-labelledby="level-label">
            <button type="button" class="level-btn is-active" data-level="low" role="radio" aria-checked="true">低</button>
            <button type="button" class="level-btn" data-level="mid" role="radio" aria-checked="false">中</button>
            <button type="button" class="level-btn" data-level="high" role="radio" aria-checked="false">高</button>
          </div>
          <span class="level-range" id="level-range">30 以內，至少兩個質因數</span>
        </div>

        <div class="actions">
          <button type="submit" class="primary">開始動畫</button>
          <button type="button" class="ghost" id="btn-random">隨機示範</button>
          <button type="button" class="ghost" id="btn-reset">重設</button>
        </div>
        </div>
      </form>
    </section>

    <section class="stage" aria-live="polite">
      <p class="stage-label" id="stage-label">短除法求最大公因數</p>
      <div class="ladder-wrap">
        <div id="ladder" class="ladder"></div>
      </div>
      <div id="picture" class="picture" hidden>
        <div id="bars" class="draw"></div>
        <p class="picture-aside">同一杯牛奶倒進刻度更細的杯子，牛奶還是那一杯。</p>
      </div>
      <p class="result" id="result">輸入分數後按「開始動畫」。</p>
    </section>
  </main>
  <script src="menu.js"></script>
  <script src="app.js"></script>
</body>
</html>
